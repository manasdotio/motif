<?xml version="1.0" encoding="UTF-8"?>
<!-- 
  Motif App Icon (org.gnome.Motif)
  Hand-authored GNOME HIG app icon

  Structure:
  - Base layer: GNOME HIG squircle template path (128x128) in Adwaita Royal Blue (#1c71d8)
  - Foreground layer: Interlocking geometric motif tile in Adwaita Sky Blue (#78aeed) and Porcelain White (#ffffff)

  Flat 3-color palette: #1c71d8, #78aeed, #ffffff (No gradients, no shadows, no stroke bloat)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Base Layer: GNOME HIG Squircle Base -->
  <path d="M 28 8 H 100 C 111.046 8 120 16.954 120 28 V 100 C 120 111.046 111.046 120 100 120 H 28 C 16.954 120 8 111.046 8 100 V 28 C 8 16.954 16.954 8 28 8 Z" fill="#1c71d8" />

  <!-- Foreground Layer: Repeating Geometric Motif Tile -->
  
  <!-- Outer Quad Lozenge Cluster (Porcelain White) -->
  <path d="M 64 24 L 78 44 L 64 54 L 50 44 Z" fill="#ffffff" />
  <path d="M 64 104 L 78 84 L 64 74 L 50 84 Z" fill="#ffffff" />
  <path d="M 24 64 L 44 50 L 54 64 L 44 78 Z" fill="#ffffff" />
  <path d="M 104 64 L 84 50 L 74 64 L 84 78 Z" fill="#ffffff" />

  <!-- Interlocking Center Diamond (Adwaita Sky Blue) -->
  <path d="M 64 46 L 82 64 L 64 82 L 46 64 Z" fill="#78aeed" />

  <!-- Core Center Emblem (Porcelain White) -->
  <path d="M 64 54 L 74 64 L 64 74 L 54 64 Z" fill="#ffffff" />
</svg>
